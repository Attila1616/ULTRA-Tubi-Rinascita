name: Dev checks

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: "ULTRA tubi Rinascita"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Runtime path tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Compile Python sources
        run: python -m py_compile runtime_paths.py backend_logic.py app.py tube_database.py tt_docx_generator.pyw
